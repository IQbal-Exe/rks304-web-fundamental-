<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <!-- TailwindCSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4 text-slate-200">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8">
    <h1 class="text-2xl font-semibold text-white">Buat akun</h1>
    <p class="text-sm text-slate-400 mt-1 mb-6">Isi data di bawah untuk mendaftar.</p>

    <!-- action diarahkan ke dashboard.html -->
    <form id="formRegister" action="dashboard.html" novalidate class="space-y-4">

      <!-- Username -->
      <div>
        <label for="username" class="block text-sm mb-1">Username</label>
        <input type="text" id="username" name="username"
          class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500" />
        <p id="errorUsername" class="text-red-400 text-xs mt-1"></p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm mb-1">Password</label>
        <input type="password" id="password" name="password"
          class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500" />
        <p id="errorPassword" class="text-red-400 text-xs mt-1"></p>
      </div>

      <!-- Nama -->
      <div>
        <label for="nama" class="block text-sm mb-1">Nama</label>
        <input type="text" id="nama" name="nama"
          class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500" />
        <p id="errorNama" class="text-red-400 text-xs mt-1"></p>
      </div>

      <!-- Tanggal lahir -->
      <div>
        <label for="tanggalLahir" class="block text-sm mb-1">Tanggal lahir</label>
        <input type="date" id="tanggalLahir" name="tanggalLahir"
          class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500 [color-scheme:dark]" />
        <p id="errorTanggalLahir" class="text-red-400 text-xs mt-1"></p>
      </div>

      <!-- Alamat -->
      <div>
        <label for="alamat" class="block text-sm mb-1">Alamat</label>
        <textarea id="alamat" name="alamat" rows="2"
          class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500"></textarea>
        <p id="errorAlamat" class="text-red-400 text-xs mt-1"></p>
      </div>

      <!-- Nomor telpon -->
      <div>
        <label for="telpon" class="block text-sm mb-1">Nomor telpon</label>
        <input type="tel" id="telpon" name="telpon" placeholder="628123456789"
          class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500" />
        <p id="errorTelpon" class="text-red-400 text-xs mt-1"></p>
      </div>

      <button type="submit"
        class="w-full py-2.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-medium transition">
        Daftar
      </button>
    </form>
  </div>

  <!-- Panggil file JavaScript validasi -->
  <script src="validasi_input.js"></script>
</body>
</html>
